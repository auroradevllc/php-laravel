kind: pipeline
type: docker
name: default

steps:
  - name: php8.1
    image: plugins/docker
    settings:
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: ocr.vultrcr.com/auroradev/tyler/php-laravel
      registry: ocr.vultrcr.com
      tags:
        - php8.1
    depends_on:
      - clone
  - name: php8.2
    image: plugins/docker
    settings:
      build_args:
        - PHP_VERSION=8.2
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: ocr.vultrcr.com/auroradev/tyler/php-laravel
      registry: ocr.vultrcr.com
      tags:
        - php8.2
    depends_on:
      - clone
  - name: php8.3
    image: plugins/docker
    settings:
      build_args:
        - PHP_VERSION=8.3
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: ocr.vultrcr.com/auroradev/tyler/php-laravel
      registry: ocr.vultrcr.com
      tags:
        - php8
        - php8.3
    depends_on:
      - clone